[project]
name = "jobflow"
version = "0.0.0"
description = "Local, human-in-the-loop automated job-application pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings",
    "jinja2",
    "httpx",
    "python-docx",
    "pdfplumber",
    "playwright",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
